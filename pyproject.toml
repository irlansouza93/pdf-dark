[project]
name = "pdf-dark"
version = "0.2.1"
description = "Leitor de PDF em modo escuro, com alternância ao vivo entre claro e escuro e conversão integrada."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Irlan Souza", email = "irlansouza193@gmail.com" }]
keywords = ["pdf", "dark-mode", "modo-escuro", "leitura", "eyestrain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing",
]

dependencies = [
    "pillow>=10.0",
    "pypdfium2>=5.0",
]

[project.scripts]
pdf-dark = "pdf_dark.cli:main"

[project.gui-scripts]
pdf-dark-gui = "pdf_dark.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_dark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
